# Pre-commit hooks configuration
# See https://pre-commit.com for more information

repos:
  # Built-in hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        description: Trims trailing whitespace from files
      - id: end-of-file-fixer
        name: Fix end of files
        description: Ensures files end with a newline
      - id: check-yaml
        name: Check YAML syntax
        description: Validates YAML file syntax
      - id: check-added-large-files
        name: Check for large files
        description: Prevents adding large files to git
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for merge conflicts
        description: Checks for merge conflict strings
      - id: check-toml
        name: Check TOML syntax
        description: Validates TOML file syntax

  # Black - code formatting
  - repo: https://github.com/psf/black
    rev: 23.12.0
    hooks:
      - id: black
        name: Format code with black
        description: Auto-formats Python code
        language_version: python3.8
        args: ['--config', 'pyproject.toml']

  # isort - import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort imports with isort
        description: Sorts and organizes Python imports
        args: ['--settings-path', 'pyproject.toml']

  # Ruff - fast Python linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.8
    hooks:
      - id: ruff
        name: Lint with ruff
        description: Fast Python linter (replaces flake8, pylint for speed)
        args: ['--fix', '--exit-non-zero-on-fix']

  # mypy - static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        name: Type check with mypy
        description: Static type checking for Python
        additional_dependencies: []
        args: ['--config-file', 'pyproject.toml']
        exclude: ^tests/
